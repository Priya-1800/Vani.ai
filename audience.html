<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vani AI | Audience Live Stream</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/effects.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="aud-body">

    <div class="aud-wrapper">
        <aside class="aud-sidebar">
            <div class="sidebar-icon" onclick="exportTranscript('Vani_Audience_Log.txt')" style="cursor: pointer;" title="Download Transcript">
                <i class="fas fa-download"></i>
            </div>
            <div class="sidebar-icon"><i class="fas fa-history"></i></div>
            <div class="sidebar-icon"><i class="fas fa-download"></i></div>
        </aside>

        <main class="aud-main">
            <header class="aud-header">
                <div class="aud-logo">Vani<span>.ai</span></div>
                <div id="status-badge" class="status-offline">Offline</div>
            </header>

            <div class="connection-panel">
                <div class="input-row">
                    <input type="text" id="viewer-name" class="aud-input" placeholder="Your Name">
                    
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #475569; margin-left: 10px;">
                        <input type="checkbox" id="aud-translate-toggle" style="width: 18px; height: 18px;">
                        Translate to:
                    </label>
                    
                    <select name="language" id="language-select">
                        <option value="ar">Arabic</option>
                        <option value="ba">Bashkir</option>
                        <option value="eu">Basque</option>
                        <option value="be">Belarusian</option>
                        <option value="bn">Bengali</option>
                        <option value="bg">Bulgarian</option>
                        <option value="yue">Cantonese</option>
                        <option value="ca">Catalan</option>
                        <option value="hr">Croatian</option>
                        <option value="cs">Czech</option>
                        <option value="da">Danish</option>
                        <option value="nl">Dutch</option>
                        <option value="en">English</option>
                        <option value="eo">Esperanto</option>
                        <option value="et">Estonian</option>
                        <option value="fi">Finnish</option>
                        <option value="fr">French</option>
                        <option value="gl">Galician</option>
                        <option value="de">German</option>
                        <option value="el">Greek</option>
                        <option value="he">Hebrew</option>
                        <option value="hi">Hindi</option>
                        <option value="hu">Hungarian</option>
                        <option value="id">Indonesian</option>
                        <option value="ia">Interlingua</option>
                        <option value="ga">Irish</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="lv">Latvian</option>
                        <option value="lt">Lithuanian</option>
                        <option value="ms">Malay</option>
                        <option value="mt">Maltese</option>
                        <option value="cmn">Mandarin</option>
                        <option value="mr">Marathi</option>
                        <option value="mn">Mongolian</option>
                        <option value="no">Norwegian</option>
                        <option value="fa">Persian</option>
                        <option value="pl">Polish</option>
                        <option value="pt">Portuguese</option>
                        <option value="ro">Romanian</option>
                        <option value="ru">Russian</option>
                        <option value="sk">Slovakian</option>
                        <option value="sl">Slovenian</option>
                        <option value="es">Spanish</option>
                        <option value="sw">Swahili</option>
                        <option value="sv">Swedish</option>
                        <option value="tl">Tagalog</option>
                        <option value="ta">Tamil</option>
                        <option value="th">Thai</option>
                        <option value="tr">Turkish</option>
                        <option value="uk">Ukrainian</option>
                        <option value="ur">Urdu</option>
                        <option value="ug">Uyghur</option>
                        <option value="vi">Vietnamese</option>
                        <option value="cy">Welsh</option>
                    </select>
                </div>
                <div class="input-row">
                    <button id="pauseBtn" class="btn-black" onclick="toggleFeed()"><i class="fas fa-pause"></i> Pause Feed</button>
                    <input type="text" id="room-link" class="aud-input link-input" placeholder="Enter Room Link / ID (e.g., VANI-123)">
                    <button id="joinBtn" class="btn-blue" onclick="joinStream()">Join Room</button>
                </div>
            </div>

            <div class="aud-canvas-container">
                <div id="live-transcript" class="aud-canvas">
                    <div class="hint-text" id="aud-hint">Enter the room link above and click Join to see the live stream...</div>
                    <span id="final-span"></span>
                    <span id="partial-span" style="color: #94a3b8; font-style: italic;"></span>
                    <div id="live-translation" style="margin-top: 15px; color: #2563eb; font-weight: 600;"></div>
                </div>
            </div>

            <button class="fab-bot" onclick="openAudienceBot()">
                <i class="fas fa-robot"></i>
            </button>
            <div style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 12px 25px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; z-index: 100;">
                <button onclick="sendReaction('❤️')" style="font-size: 28px; background: none; border: none; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">❤️</button>
                <button onclick="sendReaction('👏')" style="font-size: 28px; background: none; border: none; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">👏</button>
                <button onclick="sendReaction('🤔')" style="font-size: 28px; background: none; border: none; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">🤔</button>
                <button onclick="sendReaction('🚀')" style="font-size: 28px; background: none; border: none; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">🚀</button>
            </div>
        </main>
    </div>

    <script src="/static/js/audience_engine.js"></script>
</body>
</html>
