name: Deploy to Vercel

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       - create at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      - "orgId" in .vercel/project.json after running `vercel link` once
#   VERCEL_PROJECT_ID  - "projectId" in .vercel/project.json after running `vercel link` once
#
# Runtime environment variables (SPEECHMATICS_*, GEMINI_API_KEY, REDIS_URL, ...) are
# not read from GitHub. Set them in the Vercel project: Settings -> Environment Variables.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Fail with a readable message instead of `--token` erroring on an empty value.
      # Pull requests from forks never receive secrets, so previews are skipped there.
      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions (see the top of .github/workflows/deploy.yml)."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::$msg Skipping the preview deployment."
          else
            echo "::error::$msg"
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Deploy to production
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "Production deployment: $URL"
          echo "### Production deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy preview
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          URL=$(vercel deploy --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "Preview deployment: $URL"
          echo "### Preview deployment: $URL" >> "$GITHUB_STEP_SUMMARY"
